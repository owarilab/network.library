<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>Dots and Boxes - 点取り陣地ゲーム</title>
<style>
body {
  margin: 0;
  padding: 16px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
}
#container {
  max-width: 800px;
  margin: 0 auto;
  background: white;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
h1 {
  text-align: center;
  color: #333;
  margin: 0 0 20px 0;
  font-size: 28px;
}
#canvas {
  display: block;
  margin: 20px auto;
  border: 2px solid #333;
  border-radius: 8px;
  background: #fafafa;
  cursor: pointer;
}
.controls {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
  align-items: center;
}
.btn {
  padding: 10px 16px;
  border: none;
  border-radius: 6px;
  background: #667eea;
  color: white;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
}
.btn:hover {
  background: #5568d3;
  transform: translateY(-1px);
}
.btn:disabled {
  background: #ccc;
  cursor: not-allowed;
  transform: none;
}
input[type="text"] {
  padding: 10px;
  border: 2px solid #ddd;
  border-radius: 6px;
  font-size: 14px;
  flex: 1;
  min-width: 120px;
}
#status {
  text-align: center;
  padding: 12px;
  background: #f0f0f0;
  border-radius: 6px;
  margin: 16px 0;
  font-weight: 600;
  color: #333;
}
#players {
  margin-top: 16px;
}
.player-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px;
  margin: 6px 0;
  border-radius: 6px;
  background: #f8f8f8;
  border: 2px solid transparent;
}
.player-info.active {
  border-color: #667eea;
  background: #e8ebff;
}
.player-color {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  margin-right: 10px;
  border: 2px solid #333;
}
.player-left {
  display: flex;
  align-items: center;
}
.player-score {
  font-size: 20px;
  font-weight: 700;
  color: #667eea;
}
.game-over {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.8);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.game-over.show {
  display: flex;
}
.game-over-content {
  background: white;
  padding: 40px;
  border-radius: 12px;
  text-align: center;
  max-width: 400px;
}
.game-over-content h2 {
  margin: 0 0 20px 0;
  font-size: 32px;
  color: #667eea;
}
.winner-name {
  font-size: 24px;
  color: #333;
  margin: 10px 0;
}
#rules {
  margin-top: 16px;
  padding: 12px;
  background: #fff8e1;
  border-left: 4px solid #ffc107;
  border-radius: 4px;
  font-size: 13px;
  line-height: 1.6;
}
#rules h3 {
  margin: 0 0 8px 0;
  font-size: 15px;
  color: #f57c00;
}
.label {
  font-size: 12px;
  color: #666;
  margin-right: 6px;
}
</style>
</head>
<body>
<div id="container">
  <h1>🎮 Dots and Boxes</h1>
  
  <div class="controls">
    <input type="text" id="room_id" placeholder="ルームID" value="dots_room">
    <button class="btn" onclick="createRoom()">部屋作成</button>
    <button class="btn" onclick="joinRoom()">参加</button>
    <button class="btn" onclick="leaveRoom()">退出</button>
    <button class="btn" onclick="listRooms()">部屋一覧</button>
  </div>

  <div id="status">接続中...</div>

  <canvas id="canvas" width="600" height="600"></canvas>

  <div id="players"></div>

  <div id="rules">
    <h3>📋 ルール</h3>
    <ul style="margin: 4px 0; padding-left: 20px;">
      <li>ドット間の線をクリックして引く</li>
      <li>四角形を完成させると陣地獲得＋もう1ターン</li>
      <li>全ての線が埋まったらゲーム終了</li>
      <li>最も多く陣地を獲得したプレイヤーが勝ち</li>
    </ul>
  </div>
</div>

<div id="game-over" class="game-over">
  <div class="game-over-content">
    <h2>🎉 ゲーム終了！</h2>
    <div class="winner-name" id="winner-text"></div>
    <button class="btn" onclick="closeGameOver()" style="margin-top: 20px;">閉じる</button>
  </div>
</div>

<script>
// Game constants
const GRID_SIZE = 6; // 6x6 dots = 5x5 boxes
const DOT_RADIUS = 6;
const LINE_WIDTH = 4;
const CELL_SIZE = 80;
const PADDING = 60;

// WebSocket
var ws_socket = null;
var self_uuid = '';
var self_con_id = '';
var current_join_room_id = '';
var http_base = window.location.origin;
var ws_base = (window.location.protocol === 'https:' ? 'wss://' : 'ws://') + window.location.host;

// Game state
var gameState = {
  lines: {}, // key: "x1,y1,x2,y2" -> player_id
  boxes: {}, // key: "x,y" -> player_id
  players: {}, // connection_id -> {color, score, name}
  currentTurn: null,
  gameStarted: false,
  gameOver: false
};

var playerColors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899'];
var colorIndex = 0;

// Canvas
var canvas, ctx;

window.onload = function() {
  canvas = document.getElementById('canvas');
  ctx = canvas.getContext('2d');
  
  canvas.addEventListener('click', handleCanvasClick);
  
  initWebSocket();
  drawBoard();
};

function initWebSocket() {
  ws_socket = new WebSocket(ws_base);
  
  ws_socket.addEventListener('open', function(event) {
    self_uuid = Math.random().toString(36).slice(-8);
    ws_socket.send(self_uuid);
    updateStatus('WebSocket接続完了');
  });
  
  ws_socket.addEventListener('message', function(event) {
    try {
      let json = JSON.parse(event.data);
      
      if (json.type === 'message') {
        // Handshake echo
        if (json.message === self_uuid) {
          self_con_id = json.id;
          updateStatus('接続ID取得: ' + self_con_id.substring(0, 8));
          return;
        }
        
        // Game message
        try {
          let payload = JSON.parse(json.message);
          if (payload.game === 'dots_and_boxes') {
            handleGameMessage(payload);
          }
        } catch(e) {
          // Not a game message
        }
      } else if (json.type === 'join') {
        handlePlayerJoin(json.id);
      } else if (json.type === 'leave') {
        handlePlayerLeave(json.id);
      }
    } catch(e) {
      console.error('Message parse error:', e);
    }
  });
  
  ws_socket.addEventListener('close', function(event) {
    updateStatus('WebSocket切断');
    current_join_room_id = '';
  });
}

function handleGameMessage(payload) {
  if (payload.action === 'init') {
    // Game initialization
    gameState = payload.state;
    if (!gameState.players[self_con_id]) {
      gameState.players[self_con_id] = {
        color: playerColors[colorIndex++ % playerColors.length],
        score: 0,
        name: 'Player ' + self_con_id.substring(0, 6)
      };
    }
    gameState.gameStarted = true;
    updateStatus('ゲーム開始！');
  } else if (payload.action === 'move') {
    // Player made a move
    const { x1, y1, x2, y2, player } = payload;
    const lineKey = makeLineKey(x1, y1, x2, y2);
    gameState.lines[lineKey] = player;
    
    // Check for completed boxes
    if (payload.completedBoxes && payload.completedBoxes.length > 0) {
      payload.completedBoxes.forEach(box => {
        gameState.boxes[box.x + ',' + box.y] = player;
      });
      gameState.players[player].score += payload.completedBoxes.length;
      // Same player's turn continues
    } else {
      // Next player's turn
      gameState.currentTurn = payload.nextTurn;
    }
    
    drawBoard();
    updatePlayers();
    updateTurnStatus();
    
    // Check if game over
    if (payload.gameOver) {
      gameState.gameOver = true;
      showGameOver();
    }
  } else if (payload.action === 'state') {
    // Full state sync
    gameState = payload.state;
    drawBoard();
    updatePlayers();
    updateTurnStatus();
  }
}

function handlePlayerJoin(connection_id) {
  if (connection_id !== self_con_id && current_join_room_id) {
    // Assign color to new player
    if (!gameState.players[connection_id]) {
      gameState.players[connection_id] = {
        color: playerColors[colorIndex++ % playerColors.length],
        score: 0,
        name: 'Player ' + connection_id.substring(0, 6)
      };
    }
    
    // If I'm the first player, send game state
    if (Object.keys(gameState.players).length > 0 && !gameState.gameStarted) {
      startGame();
    }
    
    updatePlayers();
  }
}

function handlePlayerLeave(connection_id) {
  if (gameState.players[connection_id]) {
    delete gameState.players[connection_id];
    updatePlayers();
  }
}

function startGame() {
  if (gameState.gameStarted) return;
  
  const playerIds = Object.keys(gameState.players);
  if (playerIds.length < 2) {
    updateStatus('2人以上のプレイヤーが必要です');
    return;
  }
  
  gameState.gameStarted = true;
  gameState.currentTurn = playerIds[0];
  gameState.lines = {};
  gameState.boxes = {};
  
  // Reset scores
  playerIds.forEach(id => {
    gameState.players[id].score = 0;
  });
  
  sendGameMessage({
    action: 'init',
    state: gameState
  });
  
  drawBoard();
  updatePlayers();
  updateTurnStatus();
}

function handleCanvasClick(event) {
  if (!gameState.gameStarted || gameState.gameOver) return;
  if (gameState.currentTurn !== self_con_id) {
    updateStatus('あなたのターンではありません');
    return;
  }
  
  const rect = canvas.getBoundingClientRect();
  const x = event.clientX - rect.left;
  const y = event.clientY - rect.top;
  
  // Find nearest line
  const line = findNearestLine(x, y);
  if (line) {
    const lineKey = makeLineKey(line.x1, line.y1, line.x2, line.y2);
    if (gameState.lines[lineKey]) {
      updateStatus('この線は既に引かれています');
      return;
    }
    
    // Make move
    makeMove(line.x1, line.y1, line.x2, line.y2);
  }
}

function findNearestLine(clickX, clickY) {
  const threshold = 15;
  let nearest = null;
  let minDist = threshold;
  
  // Check all possible lines
  for (let row = 0; row < GRID_SIZE; row++) {
    for (let col = 0; col < GRID_SIZE; col++) {
      const dotX = PADDING + col * CELL_SIZE;
      const dotY = PADDING + row * CELL_SIZE;
      
      // Horizontal line to the right
      if (col < GRID_SIZE - 1) {
        const x1 = dotX, y1 = dotY;
        const x2 = dotX + CELL_SIZE, y2 = dotY;
        const dist = distanceToLine(clickX, clickY, x1, y1, x2, y2);
        if (dist < minDist) {
          minDist = dist;
          nearest = { x1: col, y1: row, x2: col + 1, y2: row };
        }
      }
      
      // Vertical line down
      if (row < GRID_SIZE - 1) {
        const x1 = dotX, y1 = dotY;
        const x2 = dotX, y2 = dotY + CELL_SIZE;
        const dist = distanceToLine(clickX, clickY, x1, y1, x2, y2);
        if (dist < minDist) {
          minDist = dist;
          nearest = { x1: col, y1: row, x2: col, y2: row + 1 };
        }
      }
    }
  }
  
  return nearest;
}

function distanceToLine(px, py, x1, y1, x2, y2) {
  const A = px - x1;
  const B = py - y1;
  const C = x2 - x1;
  const D = y2 - y1;
  
  const dot = A * C + B * D;
  const lenSq = C * C + D * D;
  let param = -1;
  
  if (lenSq !== 0) param = dot / lenSq;
  
  let xx, yy;
  
  if (param < 0) {
    xx = x1;
    yy = y1;
  } else if (param > 1) {
    xx = x2;
    yy = y2;
  } else {
    xx = x1 + param * C;
    yy = y1 + param * D;
  }
  
  const dx = px - xx;
  const dy = py - yy;
  return Math.sqrt(dx * dx + dy * dy);
}

function makeMove(x1, y1, x2, y2) {
  const lineKey = makeLineKey(x1, y1, x2, y2);
  gameState.lines[lineKey] = self_con_id;
  
  // Check for completed boxes
  const completedBoxes = checkCompletedBoxes(x1, y1, x2, y2);
  
  let nextTurn;
  if (completedBoxes.length > 0) {
    // Award points and same player continues
    completedBoxes.forEach(box => {
      gameState.boxes[box.x + ',' + box.y] = self_con_id;
    });
    gameState.players[self_con_id].score += completedBoxes.length;
    nextTurn = self_con_id;
  } else {
    // Next player's turn
    const playerIds = Object.keys(gameState.players);
    const currentIndex = playerIds.indexOf(gameState.currentTurn);
    nextTurn = playerIds[(currentIndex + 1) % playerIds.length];
  }
  
  gameState.currentTurn = nextTurn;
  
  // Check if game is over
  const totalBoxes = (GRID_SIZE - 1) * (GRID_SIZE - 1);
  const filledBoxes = Object.keys(gameState.boxes).length;
  const gameOver = filledBoxes === totalBoxes;
  
  if (gameOver) {
    gameState.gameOver = true;
  }
  
  // Broadcast move
  sendGameMessage({
    action: 'move',
    x1, y1, x2, y2,
    player: self_con_id,
    completedBoxes,
    nextTurn,
    gameOver
  });
  
  drawBoard();
  updatePlayers();
  updateTurnStatus();
  
  if (gameOver) {
    showGameOver();
  }
}

function checkCompletedBoxes(x1, y1, x2, y2) {
  const completed = [];
  
  // Check boxes adjacent to this line
  if (x1 === x2) {
    // Vertical line
    // Check box to the left
    if (x1 > 0) {
      if (isBoxComplete(x1 - 1, Math.min(y1, y2))) {
        completed.push({ x: x1 - 1, y: Math.min(y1, y2) });
      }
    }
    // Check box to the right
    if (x1 < GRID_SIZE - 1) {
      if (isBoxComplete(x1, Math.min(y1, y2))) {
        completed.push({ x: x1, y: Math.min(y1, y2) });
      }
    }
  } else {
    // Horizontal line
    // Check box above
    if (y1 > 0) {
      if (isBoxComplete(Math.min(x1, x2), y1 - 1)) {
        completed.push({ x: Math.min(x1, x2), y: y1 - 1 });
      }
    }
    // Check box below
    if (y1 < GRID_SIZE - 1) {
      if (isBoxComplete(Math.min(x1, x2), y1)) {
        completed.push({ x: Math.min(x1, x2), y: y1 });
      }
    }
  }
  
  return completed;
}

function isBoxComplete(x, y) {
  const boxKey = x + ',' + y;
  if (gameState.boxes[boxKey]) return false; // Already claimed
  
  // Check all 4 sides
  const top = makeLineKey(x, y, x + 1, y);
  const bottom = makeLineKey(x, y + 1, x + 1, y + 1);
  const left = makeLineKey(x, y, x, y + 1);
  const right = makeLineKey(x + 1, y, x + 1, y + 1);
  
  return gameState.lines[top] && gameState.lines[bottom] && 
         gameState.lines[left] && gameState.lines[right];
}

function makeLineKey(x1, y1, x2, y2) {
  // Normalize: smaller coordinates first
  if (x1 > x2 || (x1 === x2 && y1 > y2)) {
    return x2 + ',' + y2 + ',' + x1 + ',' + y1;
  }
  return x1 + ',' + y1 + ',' + x2 + ',' + y2;
}

function drawBoard() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // Draw boxes (filled areas)
  for (let boxKey in gameState.boxes) {
    const [x, y] = boxKey.split(',').map(Number);
    const player = gameState.boxes[boxKey];
    const color = gameState.players[player].color;
    
    ctx.fillStyle = color + '40'; // Semi-transparent
    ctx.fillRect(
      PADDING + x * CELL_SIZE + 2,
      PADDING + y * CELL_SIZE + 2,
      CELL_SIZE - 4,
      CELL_SIZE - 4
    );
  }
  
  // Draw lines
  for (let lineKey in gameState.lines) {
    const [x1, y1, x2, y2] = lineKey.split(',').map(Number);
    const player = gameState.lines[lineKey];
    const color = gameState.players[player].color;
    
    ctx.strokeStyle = color;
    ctx.lineWidth = LINE_WIDTH;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(PADDING + x1 * CELL_SIZE, PADDING + y1 * CELL_SIZE);
    ctx.lineTo(PADDING + x2 * CELL_SIZE, PADDING + y2 * CELL_SIZE);
    ctx.stroke();
  }
  
  // Draw dots
  ctx.fillStyle = '#333';
  for (let row = 0; row < GRID_SIZE; row++) {
    for (let col = 0; col < GRID_SIZE; col++) {
      const x = PADDING + col * CELL_SIZE;
      const y = PADDING + row * CELL_SIZE;
      ctx.beginPath();
      ctx.arc(x, y, DOT_RADIUS, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  
  // Draw available line hints (light gray)
  if (gameState.gameStarted && !gameState.gameOver) {
    ctx.strokeStyle = '#ddd';
    ctx.lineWidth = 2;
    
    for (let row = 0; row < GRID_SIZE; row++) {
      for (let col = 0; col < GRID_SIZE; col++) {
        const dotX = PADDING + col * CELL_SIZE;
        const dotY = PADDING + row * CELL_SIZE;
        
        // Horizontal
        if (col < GRID_SIZE - 1) {
          const lineKey = makeLineKey(col, row, col + 1, row);
          if (!gameState.lines[lineKey]) {
            ctx.beginPath();
            ctx.moveTo(dotX, dotY);
            ctx.lineTo(dotX + CELL_SIZE, dotY);
            ctx.stroke();
          }
        }
        
        // Vertical
        if (row < GRID_SIZE - 1) {
          const lineKey = makeLineKey(col, row, col, row + 1);
          if (!gameState.lines[lineKey]) {
            ctx.beginPath();
            ctx.moveTo(dotX, dotY);
            ctx.lineTo(dotX, dotY + CELL_SIZE);
            ctx.stroke();
          }
        }
      }
    }
  }
}

function updatePlayers() {
  const playersDiv = document.getElementById('players');
  playersDiv.innerHTML = '<h3 style="margin-top: 0;">プレイヤー</h3>';
  
  for (let playerId in gameState.players) {
    const player = gameState.players[playerId];
    const isActive = gameState.currentTurn === playerId;
    const isSelf = playerId === self_con_id;
    
    const div = document.createElement('div');
    div.className = 'player-info' + (isActive ? ' active' : '');
    
    const left = document.createElement('div');
    left.className = 'player-left';
    
    const colorBox = document.createElement('div');
    colorBox.className = 'player-color';
    colorBox.style.backgroundColor = player.color;
    
    const name = document.createElement('span');
    name.textContent = player.name + (isSelf ? ' (あなた)' : '');
    
    left.appendChild(colorBox);
    left.appendChild(name);
    
    const score = document.createElement('div');
    score.className = 'player-score';
    score.textContent = player.score;
    
    div.appendChild(left);
    div.appendChild(score);
    playersDiv.appendChild(div);
  }
  
  if (!gameState.gameStarted && Object.keys(gameState.players).length >= 2) {
    const startBtn = document.createElement('button');
    startBtn.className = 'btn';
    startBtn.textContent = 'ゲーム開始';
    startBtn.style.width = '100%';
    startBtn.style.marginTop = '12px';
    startBtn.onclick = startGame;
    playersDiv.appendChild(startBtn);
  }
}

function updateTurnStatus() {
  if (!gameState.gameStarted) {
    updateStatus('プレイヤーを待っています...');
    return;
  }
  
  if (gameState.gameOver) {
    updateStatus('ゲーム終了');
    return;
  }
  
  const currentPlayer = gameState.players[gameState.currentTurn];
  if (gameState.currentTurn === self_con_id) {
    updateStatus('🎯 あなたのターンです！');
  } else if (currentPlayer) {
    updateStatus(currentPlayer.name + ' のターン');
  }
}

function updateStatus(message) {
  document.getElementById('status').textContent = message;
}

function showGameOver() {
  let maxScore = -1;
  let winner = null;
  
  for (let playerId in gameState.players) {
    const score = gameState.players[playerId].score;
    if (score > maxScore) {
      maxScore = score;
      winner = playerId;
    }
  }
  
  const winnerPlayer = gameState.players[winner];
  const winnerText = document.getElementById('winner-text');
  
  if (winner === self_con_id) {
    winnerText.textContent = '🏆 あなたの勝利！';
  } else {
    winnerText.textContent = winnerPlayer.name + ' の勝利！';
  }
  winnerText.textContent += '\nスコア: ' + maxScore;
  
  document.getElementById('game-over').classList.add('show');
}

function closeGameOver() {
  document.getElementById('game-over').classList.remove('show');
}

function sendGameMessage(payload) {
  payload.game = 'dots_and_boxes';
  ws_socket.send(JSON.stringify(payload));
}

// Room management
function createRoom() {
  const roomId = document.getElementById('room_id').value;
  if (!roomId) return;
  
  const xhr = new XMLHttpRequest();
  xhr.open('POST', http_base + '/api/v1/room/create', true);
  xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4 && xhr.status === 200) {
      const json = JSON.parse(xhr.responseText);
      document.getElementById('room_id').value = json.id;
      updateStatus('部屋を作成しました: ' + json.id);
      // Auto join
      setTimeout(() => joinRoom(), 100);
    }
  };
  xhr.send('name=' + roomId);
}

function joinRoom() {
  const roomId = document.getElementById('room_id').value;
  if (!roomId || !self_con_id) return;
  
  const xhr = new XMLHttpRequest();
  xhr.open('POST', http_base + '/api/v1/room/join', true);
  xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4 && xhr.status === 200) {
      current_join_room_id = roomId;
      updateStatus('部屋に参加しました: ' + roomId);
      
      // Initialize player
      if (!gameState.players[self_con_id]) {
        gameState.players[self_con_id] = {
          color: playerColors[colorIndex++ % playerColors.length],
          score: 0,
          name: 'Player ' + self_con_id.substring(0, 6)
        };
      }
      
      updatePlayers();
    }
  };
  xhr.send('room_id=' + roomId + '&connection_id=' + self_con_id);
}

function leaveRoom() {
  if (!current_join_room_id || !self_con_id) return;
  
  const xhr = new XMLHttpRequest();
  xhr.open('POST', http_base + '/api/v1/room/leave', true);
  xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4 && xhr.status === 200) {
      updateStatus('部屋を退出しました');
      current_join_room_id = '';
      
      // Reset game state
      gameState = {
        lines: {},
        boxes: {},
        players: {},
        currentTurn: null,
        gameStarted: false,
        gameOver: false
      };
      
      drawBoard();
      updatePlayers();
    }
  };
  xhr.send('room_id=' + current_join_room_id + '&connection_id=' + self_con_id);
}

function listRooms() {
  const xhr = new XMLHttpRequest();
  xhr.open('GET', http_base + '/api/v1/room/list', true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4 && xhr.status === 200) {
      const json = JSON.parse(xhr.responseText);
      if (json.list && json.list.length > 0) {
        const roomId = json.list[0].id;
        document.getElementById('room_id').value = roomId;
        updateStatus('部屋一覧を取得しました');
      } else {
        updateStatus('利用可能な部屋がありません');
      }
    }
  };
  xhr.send();
}
</script>
