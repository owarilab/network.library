<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<title>ws sample</title>
<script type="text/javascript">
var ws_socket = null;
var self_uuid = '';
var self_con_id = '';
var current_join_room_id = '';
window.onload=function()
{
	ws_socket = new WebSocket('ws://localhost:4444');
	ws_socket.addEventListener('open', function (event) {
		self_uuid = Math.random().toString(36).slice(-8);
		ws_socket.send(self_uuid);
	});
	ws_socket.addEventListener('message', function (event) {
    	console.log('recv : ', event.data);
		try{
			let json = JSON.parse(event.data);
			if(json.id !== undefined && json.type !== undefined && json.message !== undefined)
			{
				let con_id = json.id;
				if(json.type === 'message')
				{
					// echo back
					if(json.message === self_uuid){
						self_con_id = con_id;
					}
				} else if(json.type === 'join'){
					// join other user
					if(con_id !== self_con_id)
					{
						console.log('join : ', con_id);
						// send hello message
						ws_socket.send('hello ' + con_id + ' my con id is ' + self_con_id);
					}
				} else if(json.type === 'leave'){
					// leave other user
					console.log('leave : ', con_id);
				}
			}
		}catch(e){
			console.log('error : ', e);
		}
	});
	ws_socket.addEventListener('close', function (event) {
		console.log('ws closed');
		current_join_room_id = '';
	});
}
function room_list(con_id)
{
	let xhr = new XMLHttpRequest();
	xhr.open('GET', 'http://localhost:4444/api/v1/room/list', true);
	xhr.onreadystatechange = function() {
		if (xhr.readyState === 4) {
			if (xhr.status === 200) {
				console.log('room list response : ', xhr.responseText);
				let json = JSON.parse(xhr.responseText);
				let is_join = false;
				if(json.list !== undefined)
				{
					let room_list_div = document.getElementById('room_list');
					let room_join_id = '';
					room_list_div.innerHTML = '';
					for(let i=0; i<json.list.length; i++)
					{
						let room_id = json.list[i].id;
						room_list_div.innerHTML += 'Room ID: ' + room_id + '<br>';
						room_join_id = room_id;
					}
					let room_join_id_input = document.getElementById('join_room_id');
					room_join_id_input.value = room_join_id;
				}
			}
		}
	};
	xhr.send();
}
function room_create(room_name, con_id)
{
	let xhr = new XMLHttpRequest();
	xhr.open('POST', 'http://localhost:4444/api/v1/room/create', true);
	xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
	xhr.onreadystatechange = function() {
		if (xhr.readyState === 4) {
			if (xhr.status === 200) {
				console.log('room create response : ', xhr.responseText);
				let json = JSON.parse(xhr.responseText);
				let room_id = json.id;
				console.log('created room id : ', room_id);
				let room_join_id_input = document.getElementById('join_room_id');
				room_join_id_input.value = room_id;
			}
		}
	};
	xhr.send('name=' + room_name);
}
function room_join(room_id,con_id)
{
	let xhr = new XMLHttpRequest();
	xhr.open('POST', 'http://localhost:4444/api/v1/room/join', true);
	xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
	xhr.onreadystatechange = function() {
		if (xhr.readyState === 4) {
			if (xhr.status === 200) {
				console.log('room join response : ', xhr.responseText);
				current_join_room_id = room_id;
			}
		}
	};
	xhr.send('room_id=' + room_id + '&connection_id=' + con_id);
}
function room_leave(room_id,con_id)
{
	let xhr = new XMLHttpRequest();
	xhr.open('POST', 'http://localhost:4444/api/v1/room/leave', true);
	xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
	xhr.onreadystatechange = function() {
		if (xhr.readyState === 4) {
			if (xhr.status === 200) {
				console.log('room leave response : ', xhr.responseText);
				current_join_room_id = '';
			}
		}
	};
	xhr.send('room_id=' + room_id + '&connection_id=' + con_id);
}
</script>
</head>
<body style="padding:0;margin:0">
	<button onclick="room_list(self_con_id)">room list</button>
	<form id="send_message_form">
		Message: <input type="text" id="send_message" value="hello server">
		<button type="button" onclick="ws_socket.send(document.getElementById('send_message').value)">send</button>
	</form>
	<form id="room_create_form">
		Room ID: <input type="text" id="room_id" value="test_room">
		<button type="button" onclick="room_create(document.getElementById('room_id').value, self_con_id)">room create</button>
	</form>
	<form id="room_join_form">
		Room ID: <input type="text" id="join_room_id" value="">
		<button type="button" onclick="room_join(document.getElementById('join_room_id').value, self_con_id)">room join</button>
	</form>
	<button onclick="room_leave(current_join_room_id, self_con_id)">room leave</button>
	<br><br>
	<div>
		Room List:<br>
		<div id="room_list"></div>
	</div>
</body>
</html>
