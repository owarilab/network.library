### TOOLS
- file_list: List files and directories.
  Args: {"path":"./dir","recursive":0,"pattern":"*.c"}
  recursive=1 for subdirectories. pattern uses shell glob (e.g. "*.c", "*.h", "*").

- file_read: Read lines from a file.
  Args: {"path":"./file.c","start_line":1,"end_line":50}
  Omit start_line/end_line to read the first 100 lines.

- file_search: Find files by name pattern (recursive by default).
  Args: {"path":".","pattern":"*.c","recursive":1,"max_results":50}
  Use this before file_read when the exact filename is unknown.
  pattern uses shell glob (e.g. "*.c", "main*", "*.h").

- grep_search: Search file contents for a text pattern (substring match).
  Args: {"pattern":"TODO","path":".","file_pattern":"*.c","recursive":1,"case_sensitive":0,"max_results":50}
  Returns matching lines with filename and line number.
  Use when you need to find where a specific string, identifier, or function name appears in the codebase.
  `file_pattern` filters basenames only. Do not put directory paths in `file_pattern`; use `path` for that.

- file_write: Write or append content to a file.
  Args: {"path":"./file.txt","content":"text to write","mode":"write","create_dirs":1}
  mode: "write" (overwrite) or "append" (add to end).
  create_dirs: 1 to create parent directories if needed, 0 to fail if they don't exist.
  Returns bytes_written on success. Use for creating/modifying files.

- file_edit: Replace a unique text block in a file with new content.
  Args: {"path":"./file.c","old_text":"exact text to find","new_text":"replacement text"}
  old_text: MUST be unique in the file. Include 3-5 lines of surrounding context to avoid ambiguity.
  new_text: The text that replaces old_text exactly.
  Returns success, bytes_written. Fails with an error if old_text is not found or matches multiple locations.
  Use for surgical edits to existing code without rewriting entire file.

- http_request: Send an HTTP request to an allowed host only.
  Args: {"method":"GET","url":"http://localhost:4445/api/status","headers":{"Accept":"application/json"},"body":"","timeout_ms":30000,"max_body_bytes":1048576}
  Supports `GET`, `POST`, `PUT`, `DELETE`. URL must use `http://` or `https://` and the host must be present in the whitelist.
  Returns a JSON object with `ok`, `status_code`, `headers`, `body`, and `response_time_ms`.

- url_whitelist_get: Return the list of hosts that http_request is allowed to access.
  Args: {}
  Returns a JSON object with `hosts` and `count`.

- url_whitelist_info_get: Return API documentation for a whitelisted host.
  Args: {"host":"localhost","endpoint_filter":"/api/status"}
  `host` is required. `endpoint_filter` is optional and narrows the returned endpoints.
  Returns a JSON object with `host` and `endpoints`.

