<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM SSE Chat</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #f5f7fb; }
    .container { max-width: 860px; margin: 0 auto; padding: 20px; }
    .messages {
      height: 62vh;
      overflow-y: auto;
      border: 1px solid #d7dbe3;
      border-radius: 10px;
      background: #fff;
      padding: 12px;
    }
    .msg { white-space: pre-wrap; line-height: 1.5; margin: 10px 0; }
    .msg.user { color: #1a3ea1; }
    .msg.assistant { color: #145a32; }
    .panel { margin-top: 10px; display: flex; gap: 8px; }
    .panel input {
      flex: 1;
      border: 1px solid #b9c0cc;
      border-radius: 10px;
      padding: 10px;
      font-size: 14px;
    }
    .panel button {
      border: 1px solid #7f8898;
      border-radius: 10px;
      background: #fff;
      padding: 10px 14px;
      cursor: pointer;
    }
    .panel button:disabled { opacity: 0.55; cursor: not-allowed; }
    .status { margin-top: 8px; color: #5b6472; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>LLM HTTP Streaming Chat</h2>
    <div id="messages" class="messages"></div>
    <form id="chat-form" class="panel">
      <input id="prompt" autocomplete="off" placeholder="メッセージを入力" />
      <button id="send" type="submit">送信</button>
      <button id="stop" type="button" disabled>停止</button>
    </form>
    <div id="status" class="status">ready</div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const formEl = document.getElementById('chat-form');
    const promptEl = document.getElementById('prompt');
    const sendEl = document.getElementById('send');
    const stopEl = document.getElementById('stop');
    const statusEl = document.getElementById('status');

    let abortController = null;

    function appendMessage(role, text) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function setBusy(busy) {
      sendEl.disabled = busy;
      stopEl.disabled = !busy;
      promptEl.disabled = busy;
    }

    function parseSseBlock(block) {
      const lines = block.split('\n');
      let event = 'message';
      const data = [];
      for (const line of lines) {
        if (line.startsWith('event:')) {
          event = line.slice(6).trim();
        } else if (line.startsWith('data:')) {
          let payload = line.slice(5);
          if (payload.startsWith(' ')) {
            payload = payload.slice(1);
          }
          data.push(payload);
        }
      }
      return { event, data: data.join('\n') };
    }

    async function streamChat(prompt) {
      abortController = new AbortController();
      setBusy(true);
      statusEl.textContent = 'streaming...';

      appendMessage('user', prompt);
      const assistant = appendMessage('assistant', '');

      try {
        const body = new URLSearchParams({ q: prompt });
        const response = await fetch('/api/llm/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body,
          signal: abortController.signal,
        });

        if (!response.ok || !response.body) {
          throw new Error(`HTTP ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const chunks = buffer.split('\n\n');
          buffer = chunks.pop() || '';

          for (const chunk of chunks) {
            if (!chunk.trim()) continue;
            const evt = parseSseBlock(chunk);
            if (evt.event === 'meta') {
              statusEl.textContent = evt.data || 'meta';
            } else if (evt.event === 'token') {
              if (!evt.data) continue;
              assistant.textContent += evt.data;
              messagesEl.scrollTop = messagesEl.scrollHeight;
            } else if (evt.event === 'done') {
              statusEl.textContent = 'done';
            } else if (evt.event === 'error') {
              statusEl.textContent = `error: ${evt.data}`;
            }
          }
        }
      } catch (error) {
        if (error.name === 'AbortError') {
          statusEl.textContent = 'aborted';
        } else {
          statusEl.textContent = `error: ${error.message}`;
        }
      } finally {
        abortController = null;
        setBusy(false);
        promptEl.focus();
      }
    }

    formEl.addEventListener('submit', (e) => {
      e.preventDefault();
      const prompt = promptEl.value.trim();
      if (!prompt) return;
      promptEl.value = '';
      streamChat(prompt);
    });

    stopEl.addEventListener('click', () => {
      if (abortController) {
        abortController.abort();
      }
    });
  </script>
</body>
</html>
