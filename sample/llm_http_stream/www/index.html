<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM SSE Chat</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #f5f7fb; }
    .container { max-width: 860px; margin: 0 auto; padding: 20px; }

    /* tabs */
    .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
    .tab-btn {
      padding: 8px 20px;
      border: 1px solid #b9c0cc;
      border-radius: 8px 8px 0 0;
      background: #e8eaf0;
      cursor: pointer;
      font-size: 14px;
      color: #5b6472;
    }
    .tab-btn.active {
      background: #fff;
      border-bottom-color: #fff;
      color: #1a3ea1;
      font-weight: bold;
    }

    .messages {
      height: 52vh;
      overflow-y: auto;
      border: 1px solid #d7dbe3;
      border-radius: 0 10px 10px 10px;
      background: #fff;
      padding: 12px;
    }
    .msg { white-space: pre-wrap; line-height: 1.5; margin: 10px 0; }
    .msg.user { color: #1a3ea1; }
    .msg.assistant { color: #145a32; }
    .msg .label { font-size: 11px; font-weight: bold; margin-bottom: 2px; opacity: 0.6; }

    /* RAG sources */
    .sources-box {
      margin-top: 6px;
      border: 1px solid #d7dbe3;
      border-radius: 8px;
      background: #f9fafb;
      padding: 8px 12px;
      max-height: 140px;
      overflow-y: auto;
      display: none;
    }
    .sources-box.visible { display: block; }
    .sources-title { font-size: 11px; font-weight: bold; color: #7f8898; margin-bottom: 6px; }
    .source-item {
      font-size: 12px;
      color: #3a4256;
      margin: 4px 0;
      padding: 4px 8px;
      background: #fff;
      border: 1px solid #e4e7ed;
      border-radius: 5px;
    }
    .source-item .src-meta { color: #9099a8; font-size: 11px; }

    /* RAG options */
    .rag-options {
      display: none;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      font-size: 13px;
      color: #5b6472;
    }
    .rag-options.visible { display: flex; }
    .rag-options label { white-space: nowrap; }
    .rag-options input[type=number] {
      width: 54px;
      border: 1px solid #b9c0cc;
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 13px;
    }

    .panel { margin-top: 8px; display: flex; gap: 8px; }
    .panel input {
      flex: 1;
      border: 1px solid #b9c0cc;
      border-radius: 10px;
      padding: 10px;
      font-size: 14px;
    }
    .panel button {
      border: 1px solid #7f8898;
      border-radius: 10px;
      background: #fff;
      padding: 10px 14px;
      cursor: pointer;
    }
    .panel button:disabled { opacity: 0.55; cursor: not-allowed; }
    .status { margin-top: 6px; color: #5b6472; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>LLM HTTP Streaming Chat</h2>

    <div class="tabs">
      <button class="tab-btn active" data-mode="chat">💬 チャット</button>
      <button class="tab-btn" data-mode="rag">🔍 RAG チャット</button>
    </div>

    <div id="messages" class="messages"></div>

    <div id="sources-box" class="sources-box">
      <div class="sources-title">参照ドキュメント</div>
      <div id="sources-list"></div>
    </div>

    <div id="rag-options" class="rag-options">
      <label for="top-k">top_k:</label>
      <input id="top-k" type="number" min="1" max="20" value="3" />
      <span style="color:#9099a8; font-size:12px;">（類似ドキュメントの検索件数）</span>
    </div>

    <form id="chat-form" class="panel">
      <input id="prompt" autocomplete="off" placeholder="メッセージを入力" />
      <button id="send" type="submit">送信</button>
      <button id="stop" type="button" disabled>停止</button>
    </form>
    <div id="status" class="status">ready</div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const formEl = document.getElementById('chat-form');
    const promptEl = document.getElementById('prompt');
    const sendEl = document.getElementById('send');
    const stopEl = document.getElementById('stop');
    const statusEl = document.getElementById('status');
    const sourcesBoxEl = document.getElementById('sources-box');
    const sourcesListEl = document.getElementById('sources-list');
    const ragOptionsEl = document.getElementById('rag-options');
    const topKEl = document.getElementById('top-k');

    let abortController = null;
    let currentMode = 'chat';

    // tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.dataset.mode;
        ragOptionsEl.classList.toggle('visible', currentMode === 'rag');
        sourcesBoxEl.classList.remove('visible');
        promptEl.placeholder = currentMode === 'rag'
          ? 'RAGクエリを入力（例: 日本の伝統文化は？）'
          : 'メッセージを入力';
        promptEl.focus();
      });
    });

    function appendMessage(role, text) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = role === 'user' ? 'You' : (currentMode === 'rag' ? 'Assistant (RAG)' : 'Assistant');
      div.appendChild(label);
      const body = document.createElement('span');
      body.textContent = text;
      div.appendChild(body);
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return body;
    }

    function setBusy(busy) {
      sendEl.disabled = busy;
      stopEl.disabled = !busy;
      promptEl.disabled = busy;
    }

    function renderSources(sources) {
      sourcesListEl.innerHTML = '';
      if (!sources || sources.length === 0) return;
      sources.forEach((s, i) => {
        const el = document.createElement('div');
        el.className = 'source-item';
        el.innerHTML = `<span class="src-meta">Doc ${i+1} &nbsp; id:${s.id} &nbsp; distance:${s.distance.toFixed(4)}</span><br>${s.text}`;
        sourcesListEl.appendChild(el);
      });
      sourcesBoxEl.classList.add('visible');
    }

    function parseSseBlock(block) {
      const lines = block.split('\n');
      let event = 'message';
      const data = [];
      for (const line of lines) {
        if (line.startsWith('event:')) {
          event = line.slice(6).trim();
        } else if (line.startsWith('data:')) {
          let payload = line.slice(5);
          if (payload.startsWith(' ')) payload = payload.slice(1);
          data.push(payload);
        }
      }
      return { event, data: data.join('\n') };
    }

    async function streamRequest(prompt, endpoint, extraParams) {
      abortController = new AbortController();
      setBusy(true);
      sourcesBoxEl.classList.remove('visible');
      statusEl.textContent = 'streaming...';

      appendMessage('user', prompt);
      const assistantBody = appendMessage('assistant', '');

      try {
        const params = { q: prompt, ...extraParams };
        const body = new URLSearchParams(params);
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body,
          signal: abortController.signal,
        });

        if (!response.ok || !response.body) {
          throw new Error(`HTTP ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const chunks = buffer.split('\n\n');
          buffer = chunks.pop() || '';

          for (const chunk of chunks) {
            if (!chunk.trim()) continue;
            const evt = parseSseBlock(chunk);
            if (evt.event === 'meta') {
              statusEl.textContent = evt.data || 'meta';
            } else if (evt.event === 'token') {
              if (!evt.data) continue;
              assistantBody.textContent += evt.data;
              messagesEl.scrollTop = messagesEl.scrollHeight;
            } else if (evt.event === 'sources') {
              try {
                const sources = JSON.parse(evt.data);
                renderSources(sources);
              } catch (_) {}
            } else if (evt.event === 'done') {
              statusEl.textContent = 'done';
            } else if (evt.event === 'error') {
              statusEl.textContent = `error: ${evt.data}`;
            }
          }
        }
      } catch (error) {
        if (error.name === 'AbortError') {
          statusEl.textContent = 'aborted';
        } else {
          statusEl.textContent = `error: ${error.message}`;
        }
      } finally {
        abortController = null;
        setBusy(false);
        promptEl.focus();
      }
    }

    formEl.addEventListener('submit', (e) => {
      e.preventDefault();
      const prompt = promptEl.value.trim();
      if (!prompt) return;
      promptEl.value = '';
      if (currentMode === 'rag') {
        const topK = parseInt(topKEl.value, 10) || 3;
        streamRequest(prompt, '/api/llm/rag/stream', { top_k: topK });
      } else {
        streamRequest(prompt, '/api/llm/stream', {});
      }
    });

    stopEl.addEventListener('click', () => {
      if (abortController) abortController.abort();
    });
  </script>
</body>
</html>
