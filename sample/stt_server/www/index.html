<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<title>STT sample</title>
<style>
#send_rate {
	margin-left: 16px;
	font-size: 13px;
	color: #555;
}
</style>
<script type="text/javascript" src="/js/room.js"></script>
<script type="text/javascript">
var ws_socket = null;
var http_base = window.location.origin;
var ws_base = (window.location.protocol === 'https:' ? 'wss://' : 'ws://') + window.location.host;
var stt_manager = null;

function formatBytes(b) {
	if (b >= 1024 * 1024) return (b / (1024 * 1024)).toFixed(1) + ' MB';
	if (b >= 1024) return (b / 1024).toFixed(1) + ' KB';
	return b + ' B';
}

window.onload = function() {
	stt_manager = new SttManager({
		wsBase: ws_base,
		callbacks: {
			onWsOpen: function() {
				ws_socket = stt_manager.wsSocket;
				console.log('WebSocket connected');
			},
			onWsRawMessage: function(payload) {
				console.log('recv len : ', payload.data.length);
			},
			onWsClose: function() {
				console.log('ws closed');
			},
			onSendRate: function(payload) {
				var el = document.getElementById('send_rate');
				if (el) {
					el.textContent = '送信中: ' + formatBytes(payload.rateBps) + '/s  (' + formatBytes(stt_manager.getSendStats().totalBytes) + ' total)';
				}
			},
			onSttStart: function() {
				document.getElementById('stt_start').disabled = true;
				document.getElementById('stt_stop').disabled = false;
				document.getElementById('stt_status').textContent = '録音中...';
			},
			onSttStop: function(payload) {
				document.getElementById('stt_start').disabled = false;
				document.getElementById('stt_stop').disabled = true;
				document.getElementById('stt_status').textContent = '送信完了 (' + payload.bytesSent + ' bytes)';
			},
			onCallbackError: function(payload) {
				console.log('callback error : ', payload.error);
			}
		}
	});

	ws_socket = stt_manager.connect();
}

async function stt_start() {
	if (!stt_manager) return;
	try {
		await stt_manager.startSttRecording(16000);
	} catch (err) {
		console.log('startSttRecording error : ', err);
		alert('マイクの使用が許可されていないか、エラーが発生しました。\n' + err.message);
		return;
	}
}

function stt_stop() {
	if (!stt_manager) return;
	stt_manager.stopSttRecording();
}
</script>
</head>
<body style="padding:0;margin:0">
	<div>
		<b>STT / 音声認識</b><br>
		<button id="stt_start" onclick="stt_start()">マイク開始</button>
		<button id="stt_stop" onclick="stt_stop()" disabled>録音停止 &amp; 送信</button>
		<span id="stt_status" style="margin-left:8px;color:#555">待機中</span>
		<span id="send_rate"></span>
	</div>
</body>
</html>
