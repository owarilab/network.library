<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STT V2</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="layout">
    <header class="topbar">
      <a class="wordmark" href="#">VOICE / 02</a>
      <span class="topnote">STREAMING TRANSCRIPTION</span>
      <span id="connection" class="connection" data-state="offline">OFFLINE</span>
    </header>

    <section class="workspace" aria-labelledby="page-title">
      <div class="intro">
        <p class="eyebrow">SILERO VAD &middot; WHISPER</p>
        <h1 id="page-title">音声を、<br>言葉へ。</h1>
        <p class="lede">話し終えた区間から順に文字起こしします。</p>
      </div>

      <div class="console">
        <div class="console-head">
          <div>
            <span class="micro-label">LIVE SESSION</span>
            <p id="sessionState" class="session-state">接続して開始してください</p>
          </div>
          <span id="timer" class="timer">00:00</span>
        </div>
        <div class="controls">
          <button id="startButton" class="start-button" type="button" aria-label="録音を開始">
            <span class="record-icon" aria-hidden="true"></span>
            <span>録音開始</span>
          </button>
          <button id="stopButton" class="stop-button" type="button" disabled>停止して確定</button>
        </div>
        <div class="meter" aria-hidden="true"><span id="meterFill"></span></div>
        <div class="console-foot">
          <span>16 kHz &nbsp; / &nbsp; MONO &nbsp; / &nbsp; PCM</span>
          <span id="audioState">MICROPHONE IDLE</span>
        </div>
      </div>
    </section>

    <section class="transcript" aria-labelledby="transcript-title">
      <div class="section-head">
        <div>
          <p class="eyebrow">COMMITTED SEGMENTS</p>
          <h2 id="transcript-title">文字起こし</h2>
        </div>
        <button id="clearButton" class="clear-button" type="button" title="文字起こしを消去" aria-label="文字起こしを消去">消去</button>
      </div>
      <ol id="results" class="results" aria-live="polite">
        <li id="emptyState" class="empty-state">確定した音声区間がここに表示されます。</li>
      </ol>
    </section>

    <footer class="footer"><span>STT SERVER V2</span><span>LOCAL AUDIO PROCESSING</span></footer>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
